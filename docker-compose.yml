services:
  backend:
    build: ./backend
    container_name: task_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DB_HOST=mysql-taskapp-ashir.mysql.database.azure.com
      - DB_USER=taskadmin
      - DB_PASSWORD=Ashirapp123!
      - DB_NAME=taskapp

  frontend:
    build: ./frontend
    container_name: task_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend